<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Say R!</title>
  <style>
    :root {
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17233f;
      background: #f7f4ed;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 28px;
      color: #5d6678;
      font-size: 1rem;
    }

    fieldset {
      margin: 0 auto 22px;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 10px;
      color: #5d6678;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .difficulty-options {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      border: 1px solid #d8d4ca;
      border-radius: 14px;
      background: #fff;
    }

    .difficulty-options input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .difficulty-options label {
      min-width: 84px;
      padding: 10px 14px;
      border-radius: 9px;
      color: #465066;
      font-weight: 750;
      cursor: pointer;
      user-select: none;
    }

    .difficulty-options input:checked + label {
      color: #fff;
      background: #3659b5;
    }

    .difficulty-options input:focus-visible + label {
      outline: 3px solid #f5a623;
      outline-offset: 2px;
    }

    .sentence-card {
      min-height: 250px;
      display: grid;
      place-items: center;
      padding: clamp(28px, 7vw, 54px);
      border: 1px solid #ded9cf;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 45px rgba(36, 43, 63, 0.09);
    }

    #sentence {
      margin: 0;
      font-size: clamp(1.75rem, 5.5vw, 2.75rem);
      font-weight: 720;
      line-height: 1.32;
      letter-spacing: -0.025em;
    }

    mark {
      margin: 0 -0.03em;
      padding: 0 0.08em 0.05em;
      border-radius: 0.18em;
      color: inherit;
      background: #ffe37e;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .sentence-card.highlights-off mark {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .highlight-control {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 13px auto 0;
      color: #697184;
      font-size: 0.88rem;
      cursor: pointer;
      user-select: none;
    }

    .highlight-control input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #3659b5;
    }

    .highlight-control input:focus-visible {
      outline: 3px solid #f5a623;
      outline-offset: 2px;
    }

    #new-sentence {
      width: min(360px, 100%);
      margin-top: 22px;
      padding: 16px 24px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: #17233f;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #090f20;
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }

    #new-sentence:hover {
      background: #273758;
    }

    #new-sentence:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #090f20;
    }

    #new-sentence:focus-visible {
      outline: 3px solid #f5a623;
      outline-offset: 4px;
    }

    @media (max-width: 480px) {
      body {
        align-items: start;
        padding: 28px 16px;
      }

      .subtitle {
        margin-bottom: 22px;
      }

      .difficulty-options {
        width: 100%;
      }

      .difficulty-options label {
        min-width: 0;
        padding-inline: 8px;
      }

      .sentence-card {
        min-height: 230px;
        border-radius: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #new-sentence {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Say R!</h1>
    <p class="subtitle">Read the silly sentence out loud.</p>

    <fieldset>
      <legend>Difficulty</legend>
      <div class="difficulty-options">
        <input type="radio" name="difficulty" id="easy" value="easy">
        <label for="easy">Easy</label>

        <input type="radio" name="difficulty" id="mixed" value="mixed" checked>
        <label for="mixed">Mixed</label>

        <input type="radio" name="difficulty" id="hard" value="hard">
        <label for="hard">Hard</label>
      </div>
    </fieldset>

    <section class="sentence-card" aria-label="Practice sentence">
      <p id="sentence" aria-live="polite"></p>
    </section>

    <button id="new-sentence" type="button">New sentence</button>

    <label class="highlight-control">
      <input id="highlight-toggle" type="checkbox" checked>
      Highlight R words
    </label>
  </main>

  <noscript>This page needs JavaScript to make new sentences.</noscript>

  <script>
    "use strict";

    // Asterisks mark the R-practice words that will be highlighted.
    // These are deliberately hand-written rather than assembled from random parts.
    const sentences = {
      easy: [
        "The *nervous* *deer* chose a *purple* *sweater* because the *freezer* felt *better*.",
        "The *teacher* *heard* a *hamster* *whisper*, “The *burger* is in the *freezer*.”",
        "A *cheerful* *mermaid* *served* *cereal* to a *bird* with *earrings*.",
        "The *weird* *drummer* *discovered* a *turnip* *under* his *dessert*.",
        "A *furry* *monster* put *butter* on a *mirror* and called it *dinner*.",
        "A *thirsty* *wizard* *searched* every *theater*, hunting a missing *fern*.",
        "The *deer* *heard* the *steer* *whisper* that the *pier* was haunted.",
        "My *sister* *measured* a *burger* with an *earring* and seemed *surprised*.",
        "The *bearded* *surfer* *turned* his *sweater* into a *hamster* *shelter*.",
        "A *nervous* *bird* *cheered* when the *teacher* dropped *her* *dessert*.",
        "The *perfect* *drummer* hid *cereal* in every *winter* mitten.",
        "A *purple* *hamster* *discovered* that *ferns* make bad *dinner* guests.",
        "The *fearful* *hamster* *cheered* when the *furry* *monster* sneezed.",
        "A *mermaid* *whispered* to the *deer* *during* *dinner*, “Please pass the *butter*.”",
        "The *bearded* *wizard* *heard* a *bird* singing inside the *mirror*.",
        "The *teacher* *turned* *her* *sweater* inside out and found a *fern*.",
        "Some *cereal* *near* the *mirror* made my *sister* *nervous*.",
        "A *purple* *hamster* *discovered* a tiny *burger* beneath the *fern*.",
        "The *teacher* found *her* *earring* inside the *hamster's* *dinner*.",
        "A *furry* *bird* *feared* the *weird* *beard* in the *mirror*.",
        "The *surfer* *served* *cereal* to a *monster* *during* *winter*.",
        "My *sister* *heard* a *mermaid* *cheer* *near* the end of the *pier*.",
        "The *thirsty* *deer* *turned* a *fern* into a *perfect* *birdhouse*.",
        "A *nervous* *teacher* *discovered* a *hamster* asleep in the *freezer*."
      ],
      mixed: [
        "A *nervous* *pirate* *parked* his *cart* at the *fair* and made a *pear* buy a ticket.",
        "The *cheerful* *bear* *served* *burgers* at the *fair*, but a food critic gave them one *star*.",
        "A *deer* *parked* a *cart* *near* the *pier* because the wheels felt *scared* of sand.",
        "The *purple* *vampire* *feared* the *fire*, so candles made him *nervous*.",
        "The *teacher* found a *hairy* *pear* hiding *under* a *chair* and gave it a *haircut*.",
        "A *furry* *shark* *wore* a *scarf* to *dinner* to impress a *burger*.",
        "The *mermaid* *shared* *cereal* with a *dinosaur* at the *shore*, but nobody brought the *fork*.",
        "A *thirsty* *horse* *carried* a *burger* to the *barn*, then ate the *wrapper*.",
        "The *weird* *pirate* *parked* a *scooter* by the *fire*; it demanded a *driver*.",
        "My *sister* *scared* a *bear* with a *sparkly* *jar* labeled “Fresh *Air*.”",
        "The *nervous* *hamster* *wore* a *scarf* to the *fair* because its tail felt *bare*.",
        "A *cheerful* *farmer* *discovered* *corn* in his *sweater* and blamed the *scarecrow*.",
        "The *bird* *stared* at a *vampire* *near* the *campfire* until both felt *awkward*.",
        "A *teacher* *carried* a *fiery* cake onto the *porch*; the candles screamed *first*.",
        "The *furry* *monster* *snored* through a *stormy* *morning*, waking the *popcorn*.",
        "A *mermaid* *wore* a *square* hat on the *pier* and called it high fashion.",
        "The *bearded* *dinosaur* *shared* a *pear* with my *sister*, then ate the *silverware*.",
        "A *tired* *bear* *heard* a *bird* *near* the *barn* and requested quiet.",
        "The *surfer* found a *hair* in his *burger* at the *park* and asked it to leave.",
        "A *purple* *horse* *admired* a *star* at *dinner* until *dessert* arrived.",
        "The *vampire* *served* *popcorn* to the *teacher* at the *shore* *during* sunrise.",
        "A *scary* *fairy* *steered* a *cart* through the *park*; it demanded a *parking* pass.",
        "The *deer* *carried* *firewood* to the *farmer's* *barn*, but it complained.",
        "A *cheerful* *pirate* hid a *guitar* *under* the *stairs*, then chose the wrong *stair*."
      ],
      hard: [
        "The *world's* *worst* *squirrel* *hurled* a *pearl* at a *walrus* in a bathrobe.",
        "A *curly-haired* *girl* *twirled* around the *world*, got dizzy, and blamed *her* *skirt*.",
        "The *squirrel* *curled* up beside a *pearl* *during* a *thunderstorm* because lightning looked suspicious.",
        "The *girl* *tried* to *twirl* *thirty* *pearls* *before* breakfast; breakfast won.",
        "An *early* *bird* *hurled* *corn* across the *world* and missed the *Earth*.",
        "A *purple* *squirrel* *wore* a *pearl* necklace to impress the *girl*; she yawned.",
        "The *world's* *curliest* *squirrel* *twirled* on a *surfboard* while the waves applauded.",
        "A *girl* with *curly* *hair* found a *pearl* in *her* *cereal* and blamed breakfast.",
        "The *squirrel* *hurled* a *burger* past the *world's* smallest *barn* and called it *airmail*.",
        "An *early* *bird* *twirled* a *scarf* around a *farmer*; he thanked the *weather*.",
        "A *curly-haired* *girl* *carried* a *pearl* through the *storm* because the *purse* was full.",
        "The *squirrel* *curled* up inside a *purple* *jar* and called it a *resort*.",
        "The *girl* *hurled* *popcorn* at a *squirrel* *wearing* *pearls*; it kept snacking.",
        "A *pearl* rolled around the *world* while the *squirrel* *snored* through the *entire* rescue.",
        "The *curly* *squirrel* *twirled* beside the *world's* *largest* *fire*.",
        "The *girl* *wore* *thirty* *pearls* while *steering* a *cart*; it looked jealous.",
        "The *squirrel* *hurled* a *pearl* into the *farmer's* *corn* and shouted, “*World record!*”",
        "The *world's* *earliest* *bird* *curled* up *near* the *fire* and slept past breakfast.",
        "A *curly* *girl* *shared* a *pear* with a *squirrel*, then demanded a receipt.",
        "The *squirrel* *twirled* a *fork* while *stirring* *corn*; the *server* ducked.",
        "The *girl* *carried* three *pearls* around the *world* in a *purple* *purse*.",
        "A *curly* *squirrel* *wore* a *scarf* made of *pearls* and felt extremely fancy.",
        "An *early* *bird* shocked the *girl* by *hurling* a *pearl* into the *cereal*.",
        "The *world's* smallest *squirrel* *curled* up beside the *fire* and *ordered* a tiny *burger*."
      ]
    };

    const sentenceElement = document.querySelector("#sentence");
    const sentenceCard = document.querySelector(".sentence-card");
    const newSentenceButton = document.querySelector("#new-sentence");
    const highlightToggle = document.querySelector("#highlight-toggle");
    const difficultyInputs = document.querySelectorAll('input[name="difficulty"]');
    const decks = { easy: [], mixed: [], hard: [] };
    const lastShown = { easy: null, mixed: null, hard: null };

    function shuffled(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const other = Math.floor(Math.random() * (index + 1));
        [result[index], result[other]] = [result[other], result[index]];
      }
      return result;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"]/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;"
      })[character]);
    }

    function renderSentence(sentence) {
      return sentence
        .split("*")
        .map((part, index) => index % 2 === 1
          ? `<mark>${escapeHtml(part)}</mark>`
          : escapeHtml(part))
        .join("");
    }

    function nextSentence(difficulty) {
      if (decks[difficulty].length === 0) {
        decks[difficulty] = shuffled(sentences[difficulty]);
        if (decks[difficulty][decks[difficulty].length - 1] === lastShown[difficulty]) {
          [decks[difficulty][0], decks[difficulty][decks[difficulty].length - 1]] =
            [decks[difficulty][decks[difficulty].length - 1], decks[difficulty][0]];
        }
      }

      const sentence = decks[difficulty].pop();
      lastShown[difficulty] = sentence;
      return sentence;
    }

    function selectedDifficulty() {
      return document.querySelector('input[name="difficulty"]:checked').value;
    }

    function showNewSentence() {
      const sentence = nextSentence(selectedDifficulty());
      sentenceElement.innerHTML = renderSentence(sentence);
    }

    function updateHighlighting() {
      sentenceCard.classList.toggle("highlights-off", !highlightToggle.checked);
    }

    function validateContent() {
      for (const difficulty of ["easy", "mixed", "hard"]) {
        if (sentences[difficulty].length !== 24) {
          throw new Error(`${difficulty} should contain exactly 24 sentences.`);
        }

        if (new Set(sentences[difficulty]).size !== sentences[difficulty].length) {
          throw new Error(`${difficulty} contains a duplicate sentence.`);
        }

        for (const sentence of sentences[difficulty]) {
          const markers = (sentence.match(/\*/g) || []).length;
          const targetCount = markers / 2;
          if (markers % 2 !== 0 || targetCount < 3 || targetCount > 6) {
            throw new Error(`${difficulty} has a sentence with invalid target markup: ${sentence}`);
          }
        }
      }
    }

    newSentenceButton.addEventListener("click", showNewSentence);
    highlightToggle.addEventListener("change", updateHighlighting);
    difficultyInputs.forEach((input) => input.addEventListener("change", showNewSentence));

    validateContent();
    updateHighlighting();
    showNewSentence();
  </script>
</body>
</html>
