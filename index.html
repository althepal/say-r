<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Say R!</title>
  <style>
    :root {
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17233f;
      background: #f7f4ed;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      position: relative;
      width: min(960px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 28px;
      color: #5d6678;
      font-size: 1rem;
    }

    .search-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid #d8d4ca;
      border-radius: 50%;
      color: #586174;
      background: rgba(255, 255, 255, 0.82);
      font: inherit;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(36, 43, 63, 0.08);
    }

    .search-toggle:hover,
    .search-toggle[aria-expanded="true"] {
      color: #3659b5;
      background: #edf1fb;
      box-shadow: 0 3px 9px rgba(36, 43, 63, 0.12);
    }

    .search-toggle svg {
      width: 18px;
      height: 18px;
    }

    .search-toggle:focus-visible,
    .search-close:focus-visible,
    #sentence-search-input:focus-visible,
    .search-result:focus-visible {
      outline: 3px solid #f5a623;
      outline-offset: 2px;
    }

    .search-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 5;
      width: min(390px, calc(100vw - 48px));
      padding: 14px;
      border: 1px solid #d8d4ca;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(36, 43, 63, 0.18);
      color: #5d6678;
      font-size: 0.9rem;
      text-align: left;
    }

    .difficulty-row {
      position: relative;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
    }

    .search-panel[hidden] {
      display: none;
    }

    .search-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #17233f;
      font-weight: 800;
    }

    .search-close {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #697184;
      background: transparent;
      font: inherit;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .search-close:hover {
      color: #17233f;
      background: #f1f2f5;
    }

    #sentence-search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #c9c5bb;
      border-radius: 8px;
      color: #17233f;
      background: #fff;
      font: inherit;
    }

    .search-status {
      margin: 7px 3px 0;
      font-size: 0.78rem;
    }

    .search-results {
      display: grid;
      gap: 4px;
      max-height: 230px;
      margin-top: 7px;
      overflow-y: auto;
    }

    .search-result {
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      color: #26324d;
      background: transparent;
      font: inherit;
      line-height: 1.3;
      text-align: left;
      cursor: pointer;
    }

    .search-result:hover {
      background: #f4f6fb;
    }

    fieldset {
      margin: 0 auto 22px;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 10px;
      color: #5d6678;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .difficulty-options {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      border: 1px solid #d8d4ca;
      border-radius: 14px;
      background: #fff;
    }

    .difficulty-options input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .difficulty-options label {
      min-width: 84px;
      padding: 10px 14px;
      border-radius: 9px;
      color: #465066;
      font-weight: 750;
      cursor: pointer;
      user-select: none;
    }

    .difficulty-options input:checked + label {
      color: #fff;
      background: #3659b5;
    }

    .difficulty-options input:focus-visible + label {
      outline: 3px solid #f5a623;
      outline-offset: 2px;
    }

    .difficulty-options input:disabled + label {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .sentence-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
      min-height: 330px;
      overflow: hidden;
      border: 1px solid #ded9cf;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 45px rgba(36, 43, 63, 0.09);
    }

    .sentence-copy {
      min-height: 330px;
      display: grid;
      place-items: center;
      padding: clamp(42px, 6vw, 64px);
    }

    .illustration-frame {
      width: 100%;
      aspect-ratio: 1;
      align-self: center;
      margin: 0;
      overflow: hidden;
      background: #e9eef5;
    }

    #illustration {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    #sentence {
      margin: 0;
      font-size: clamp(1.75rem, 5.5vw, 2.75rem);
      font-weight: 720;
      line-height: 1.32;
      letter-spacing: -0.025em;
    }

    mark {
      margin: 0 -0.03em;
      padding: 0 0.08em 0.05em;
      border-radius: 0.18em;
      color: inherit;
      background: #ffe37e;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .favorite-toggle {
      position: absolute;
      top: 13px;
      right: 13px;
      z-index: 1;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #7a8292;
      background: rgba(255, 255, 255, 0.9);
      font: inherit;
      font-size: 1.75rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(23, 35, 63, 0.14);
    }

    .favorite-toggle:hover {
      color: #b07300;
      background: #fff7d6;
    }

    .favorite-toggle[aria-pressed="true"] {
      color: #b07300;
    }

    .favorite-toggle:focus-visible {
      outline: 3px solid #f5a623;
      outline-offset: 2px;
    }

    .sentence-card.highlights-off mark {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .practice-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin: 13px auto 0;
    }

    .small-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #697184;
      font-size: 0.88rem;
      cursor: pointer;
      user-select: none;
    }

    .small-control input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #3659b5;
    }

    .small-control input:focus-visible {
      outline: 3px solid #f5a623;
      outline-offset: 2px;
    }

    .small-control:has(input:disabled) {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .qa-link {
      display: inline-block;
      margin-top: 24px;
      color: #9297a3;
      font-size: 0.72rem;
      text-decoration: none;
    }

    .qa-link:hover {
      color: #5d6678;
      text-decoration: underline;
    }

    .qa-link:focus-visible,
    .qa-back:focus-visible {
      outline: 3px solid #f5a623;
      outline-offset: 3px;
    }

    .qa-view {
      width: min(1040px, 100%);
      padding: 16px 0 40px;
      text-align: left;
    }

    .qa-view[hidden] {
      display: none;
    }

    .qa-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
    }

    .qa-header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .qa-back {
      color: #697184;
      font-size: 0.85rem;
    }

    .qa-group + .qa-group {
      margin-top: 42px;
    }

    .qa-group h2 {
      margin: 0 0 14px;
      text-transform: capitalize;
    }

    .qa-count {
      color: #9297a3;
      font-size: 0.75em;
      font-weight: 500;
    }

    .qa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
    }

    .qa-card {
      overflow: hidden;
      border: 1px solid #dedbd3;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 10px rgba(36, 43, 63, 0.06);
    }

    .qa-card img,
    .qa-image-missing {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      background: #e9eef5;
    }

    .qa-image-missing {
      display: grid;
      place-items: center;
      color: #7a8292;
      font-size: 0.8rem;
    }

    .qa-card-copy {
      padding: 13px 14px 14px;
    }

    .qa-card p {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      line-height: 1.4;
    }

    .qa-meta {
      display: block;
      margin-top: 8px;
      overflow-wrap: anywhere;
      color: #9297a3;
      font-size: 0.68rem;
    }

    .sentence-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: min(418px, 100%);
      margin: 22px auto 0;
    }

    #previous-sentence {
      display: grid;
      flex: 0 0 48px;
      place-items: center;
      padding: 0;
      border: 1px solid #d8d4ca;
      border-radius: 14px;
      color: #586174;
      background: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(36, 43, 63, 0.1);
    }

    #previous-sentence:hover:not(:disabled) {
      color: #3659b5;
      background: #edf1fb;
    }

    #previous-sentence:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      box-shadow: none;
    }

    #previous-sentence svg {
      width: 21px;
      height: 21px;
    }

    #previous-sentence:focus-visible {
      outline: 3px solid #f5a623;
      outline-offset: 3px;
    }

    #new-sentence {
      flex: 1;
      width: auto;
      padding: 16px 24px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: #17233f;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #090f20;
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }

    #new-sentence:hover {
      background: #273758;
    }

    #new-sentence:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #090f20;
    }

    #new-sentence:focus-visible {
      outline: 3px solid #f5a623;
      outline-offset: 4px;
    }

    @media (max-width: 720px) {
      .sentence-card {
        grid-template-columns: 1fr;
      }

      .sentence-copy {
        min-height: 230px;
      }

      .illustration-frame {
        width: min(100%, 420px);
        min-height: 0;
        height: auto;
        margin: 0 auto 18px;
        border-radius: 18px;
      }
    }

    @media (max-width: 480px) {
      body {
        align-items: start;
        padding: 28px 16px;
      }

      .subtitle {
        margin-bottom: 22px;
      }

      .difficulty-options {
        width: 100%;
      }

      .difficulty-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        width: 100%;
      }

      .difficulty-options label {
        min-width: 0;
        padding-inline: 8px;
      }

      .sentence-card {
        border-radius: 20px;
      }

      .sentence-copy {
        padding: 42px 26px 32px;
      }

      .illustration-frame {
        width: 100%;
        margin-bottom: 0;
        border-radius: 0;
      }

      .qa-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #new-sentence {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main id="practice-app">
    <h1>Say R!</h1>
    <p class="subtitle">Read the silly sentence out loud.<br>These sentences practice vocalic R sounds.</p>

    <fieldset>
      <legend>Difficulty</legend>
      <div class="difficulty-row">
        <div class="difficulty-options">
          <input type="radio" name="difficulty" id="easy" value="easy" checked>
          <label for="easy">Easy</label>

          <input type="radio" name="difficulty" id="mixed" value="mixed">
          <label for="mixed">Medium</label>

          <input type="radio" name="difficulty" id="hard" value="hard">
          <label for="hard">Hard</label>
        </div>
        <button class="search-toggle" id="search-toggle" type="button" aria-expanded="false" aria-controls="search-panel" aria-label="Find a sentence" title="Find a sentence">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="m15.5 15.5 4 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
          </svg>
        </button>
        <div class="search-panel" id="search-panel" hidden>
          <div class="search-heading">
            <label for="sentence-search-input">Find a sentence</label>
            <button class="search-close" id="search-close" type="button" aria-label="Close search">×</button>
          </div>
          <input id="sentence-search-input" type="search" autocomplete="off" placeholder="Try squirrel, cereal, or fire">
          <p class="search-status" id="search-status" aria-live="polite">Type a word or phrase.</p>
          <div class="search-results" id="search-results"></div>
        </div>
      </div>
    </fieldset>

    <section class="sentence-card" aria-label="Practice sentence">
      <button class="favorite-toggle" id="favorite-toggle" type="button" aria-pressed="false" aria-label="Add sentence to favorites" title="Add sentence to favorites">☆</button>
      <div class="sentence-copy">
        <p id="sentence" aria-live="polite"></p>
      </div>
      <figure class="illustration-frame" aria-hidden="true">
        <img id="illustration" alt="" decoding="async">
      </figure>
    </section>

    <div class="sentence-actions">
      <button id="previous-sentence" type="button" disabled aria-label="Previous sentence" title="Previous sentence">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </button>
      <button id="new-sentence" type="button">New sentence</button>
    </div>

    <div class="practice-controls">
      <label class="small-control">
        <input id="highlight-toggle" type="checkbox" checked>
        Highlight R words
      </label>

      <label class="small-control">
        <input id="favorites-only-toggle" type="checkbox" disabled>
        Favorites only (<span id="favorite-count">0</span>)
      </label>
    </div>

    <a class="qa-link" href="index.html?qa=1">All sentences</a>
  </main>

  <main class="qa-view" id="qa-view" hidden>
    <header class="qa-header">
      <h1>All sentences</h1>
      <a class="qa-back" href="index.html">Back to app</a>
    </header>
    <div id="qa-groups"></div>
  </main>

  <noscript>This page needs JavaScript to make new sentences.</noscript>

  <script>
    "use strict";

    // Asterisks mark vocalic/post-vocalic R practice words (not initial R words).
    // These are deliberately hand-written rather than assembled from random parts.
    const sentences = {
      easy: [
        "The *nervous* *deer* *wore* a *purple* *sweater* and *curled* up by the *freezer*.",
        "The *teacher* *heard* a *hamster* *whisper*, “The *burger* is in the *freezer*.”",
        "A *cheerful* *mermaid* *served* *cereal* to a *bird* with *earrings*.",
        "The *weird* *drummer* *discovered* a *turnip* *under* his *dessert*.",
        "A *furry* *monster* put *butter* on a *mirror* and called it *dinner*.",
        "A *thirsty* *wizard* *searched* the *theater* and found a missing *fern*.",
        "The *deer* *heard* a *steer* *whisper*, ‘*There's* a *monster* by the *pier*.’",
        "My *sister* *measured* a *burger* with an *earring* and seemed *surprised*.",
        "The *bearded* *surfer* *turned* his *sweater* into a *hamster* *shelter*.",
        "A *nervous* *bird* *cheered* when the *teacher* dropped *her* *dessert*.",
        "The *perfect* *drummer* *served* *cereal* in a *winter* mitten.",
        "A *purple* *hamster* *served* *ferns* to its *dinner* guests.",
        "The *fearful* *hamster* *cheered* when the *furry* *monster* sneezed.",
        "A *mermaid* *whispered* to the *deer* *during* *dinner*, “Please pass the *butter*.”",
        "The *bearded* *wizard* *heard* a *bird* singing inside the *mirror*.",
        "The *teacher* *turned* *her* *sweater* inside out and found a *fern*.",
        "*Cereal* by the *mirror* made my *sister* *nervous*.",
        "A *purple* *hamster* *discovered* a tiny *burger* beneath the *fern*.",
        "The *teacher* found *her* *earring* inside the *hamster's* *dinner*.",
        "A *furry* *bird* *feared* the *weird* *beard* in the *mirror*.",
        "The *surfer* *served* *cereal* to a *monster* *during* *winter*.",
        "My *sister* *heard* a *mermaid* *cheer* *under* the *pier*.",
        "The *thirsty* *deer* *turned* a *fern* into a *perfect* *birdhouse*.",
        "A *nervous* *teacher* *discovered* a *hamster* asleep in the *freezer*.",
        "The *shark* *wore* a *purple* *shirt* and *served* *corn* to a *starfish*."
      ],
      mixed: [
        "A *nervous* *pirate* *parked* his *cart* at the *fair* and made a *pear* buy a ticket.",
        "The *cheerful* *bear* *served* *burgers* at the *fair*, but a food critic gave them one *star*.",
        "The *deer* *parked* a *cart* *near* the *pier*, and its wheels *feared* sand.",
        "The *purple* *vampire* *feared* the *fire*, but even the candles grew *nervous*.",
        "The *teacher* found a *hairy* *pear* hiding *under* a *chair* and gave it a *haircut*.",
        "A *furry* *shark* *wore* a *scarf* to *dinner* to impress a *burger*.",
        "A *mermaid* *shared* *cereal* with a *dinosaur* at the *shore*, but nobody brought a *fork*.",
        "A *thirsty* *horse* *carried* a *burger* to the *barn*, then ate the *wrapper*.",
        "The *weird* *pirate* *parked* a *cart* by the *fire*, and it demanded a *driver*.",
        "My *sister* *scared* a *bear* with a *sparkly* *jar* labeled “Fresh *Air*.”",
        "The *nervous* *hamster* *wore* a *scarf* to the *fair* because its tail felt *bare*.",
        "A *cheerful* *farmer* *discovered* *corn* in his *sweater* and blamed the *scarecrow*.",
        "A *bird* *stared* at a *vampire* by the *campfire* until they both felt *awkward*.",
        "A *teacher* *carried* a *fiery* cake onto the *porch*, and the candles *ordered* a *fire extinguisher*.",
        "The *furry* *monster* *snored* through a *stormy* *morning*, waking the *popcorn*.",
        "A *mermaid* *wore* a *square* hat on the *pier*, and a fashion *reporter* called it *perfect*.",
        "The *bearded* *dinosaur* *shared* a *pear* with my *sister*, then ate the *silverware*.",
        "A *tired* *bear* *heard* a *bird* by the *barn* and *ordered* fluffy *earplugs*.",
        "The *surfer* found a *hair* in his *burger* at the *park* and asked *for* the *manager*.",
        "A *purple* *horse* *admired* a *star* at *dinner* until *dessert* *arrived*.",
        "The *vampire* *served* *popcorn* to the *teacher* at the *shore* *during* sunrise.",
        "A *scary fairy* *steered* a *cart* through the *park* *toward* a *purple carousel*.",
        "The *deer* *carried* *firewood* to the *farmer's* *barn*, but it demanded a *driver*.",
        "A *cheerful* *pirate* hid a *guitar* *under* the *stairs*, then chose the wrong *stair*.",
        "*After* the *turtle* *stirred* *yogurt* with a *fork*, a *bird* asked *for* *more*."
      ],
      hard: [
        "The *world's* *worst* *squirrel* *hurled* a *pearl* at a *walrus* in a bathrobe.",
        "A *curly-haired* *girl* *twirled* *around* the *world*, got dizzy, and blamed *her* *skirt*.",
        "The *squirrel* *curled* *around* a *pearl* *during* a *thunderstorm* because the *weather* felt *personal*.",
        "The *girl* *tried* to *twirl* *thirty* *pearls*, and the *cereal* was the *winner*.",
        "An *early* *bird* *hurled* *corn* across the *world* and missed the *Earth*.",
        "A *purple* *squirrel* *wore* a *pearl* necklace but *preferred* a *burger*.",
        "The *world's* *curliest* *squirrel* *twirled* on a *surfboard* while the waves demanded an *encore*.",
        "A *curly-haired* *girl* found a *pearl* in *her* *cereal* and blamed the *server*.",
        "The *squirrel* *hurled* a *burger* past the *world's* smallest *barn* and called it *airmail*.",
        "An *early* *bird* *twirled* a *scarf* *around* a *farmer*, and he thanked the *weather*.",

    const difficultyInputs = document.querySelectorAll('input[name="difficulty"]');
    const difficultyLabels = { easy: "Easy", mixed: "Medium", hard: "Hard" };
    const decks = { easy: [], mixed: [], hard: [] };
    const lastShown = { easy: null, mixed: null, hard: null };
    let illustrationDeck = [];
    let lastIllustration = null;
    const favoriteStorageKey = "say-r-favorites-v1";
    const difficultyStorageKey = "say-r-difficulty-v1";
    const currentSentenceStorageKey = "say-r-current-sentence-v1";
    const availableSentences = new Set(Object.values(sentences).flat());
    const searchableSentences = Object.entries(sentences).flatMap(([difficulty, entries]) =>
      entries.map((sentence) => ({
        difficulty,
        sentence,
        plainText: sentence.replaceAll("*", "")
      }))
    );
    let favorites = loadFavorites();
    let favoriteDeck = [];
    let lastFavorite = null;
    let currentSentence = null;
    const sentenceHistory = [];

    function shuffled(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const other = Math.floor(Math.random() * (index + 1));
        [result[index], result[other]] = [result[other], result[index]];
      }
      return result;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"]/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;"
      })[character]);
    }

    function renderSentence(sentence) {
      return sentence
        .split("*")
        .map((part, index) => index % 2 === 1
          ? `<mark>${escapeHtml(part)}</mark>`
          : escapeHtml(part))
        .join("");
    }

    function loadFavorites() {
      try {
        const saved = JSON.parse(localStorage.getItem(favoriteStorageKey) || "[]");
        return new Set(saved.filter((sentence) => availableSentences.has(sentence)));
      } catch {
        return new Set();
      }
    }

    function saveFavorites() {
      try {
        localStorage.setItem(favoriteStorageKey, JSON.stringify([...favorites]));
      } catch {
        // Favorites still work for this visit if browser storage is unavailable.
      }
    }

    function loadDifficulty() {
      try {
        const saved = localStorage.getItem(difficultyStorageKey);
        return ["easy", "mixed", "hard"].includes(saved) ? saved : "easy";
      } catch {
        return "easy";
      }
    }

    function saveDifficulty(difficulty) {
      try {
        localStorage.setItem(difficultyStorageKey, difficulty);
      } catch {
        // The selected difficulty still works for this visit if storage is unavailable.
      }
    }

    function loadCurrentSentence() {
      try {
        const saved = localStorage.getItem(currentSentenceStorageKey);
        return availableSentences.has(saved) ? saved : null;
      } catch {
        return null;
      }
    }

    function saveCurrentSentence(sentence) {
      try {
        localStorage.setItem(currentSentenceStorageKey, sentence);
      } catch {
        // The current sentence still works for this visit if storage is unavailable.
      }
    }

    function nextSentence(difficulty) {
      if (decks[difficulty].length === 0) {
        decks[difficulty] = shuffled(sentences[difficulty]);
        if (decks[difficulty][decks[difficulty].length - 1] === lastShown[difficulty]) {
          [decks[difficulty][0], decks[difficulty][decks[difficulty].length - 1]] =
            [decks[difficulty][decks[difficulty].length - 1], decks[difficulty][0]];
        }
      }

      const sentence = decks[difficulty].pop();
      lastShown[difficulty] = sentence;
      return sentence;
    }

    function nextIllustration() {
      if (illustrationDeck.length === 0) {
        illustrationDeck = shuffled(illustrations);
        if (illustrationDeck[illustrationDeck.length - 1] === lastIllustration && illustrationDeck.length > 1) {
          [illustrationDeck[0], illustrationDeck[illustrationDeck.length - 1]] =
            [illustrationDeck[illustrationDeck.length - 1], illustrationDeck[0]];
        }
      }

      const illustration = illustrationDeck.pop();
      lastIllustration = illustration;
      return illustration;
    }

    function updateIllustration(sentence) {
      const matchingIllustration = illustrations.find((item) => item.sentence === sentence);
      const illustration = matchingIllustration || nextIllustration();
      lastIllustration = illustration;
      illustrationElement.src = illustration.src;
    }

    function nextFavoriteSentence() {
      if (favoriteDeck.length === 0) {
        favoriteDeck = shuffled([...favorites]);
        if (favoriteDeck[favoriteDeck.length - 1] === lastFavorite && favoriteDeck.length > 1) {
          [favoriteDeck[0], favoriteDeck[favoriteDeck.length - 1]] =
            [favoriteDeck[favoriteDeck.length - 1], favoriteDeck[0]];
        }
      }

      const sentence = favoriteDeck.pop();
      lastFavorite = sentence;
      return sentence;
    }

    function selectedDifficulty() {
      return document.querySelector('input[name="difficulty"]:checked').value;
    }

    function difficultyForSentence(sentence) {
      return Object.keys(sentences).find((difficulty) => sentences[difficulty].includes(sentence));
    }

    function updatePreviousSentenceControl() {
      previousSentenceButton.disabled = sentenceHistory.length === 0;
    }

    function showSentence(sentence, { remember = true } = {}) {
      if (remember && currentSentence !== null && currentSentence !== sentence) {
        sentenceHistory.push(currentSentence);
      }
      currentSentence = sentence;
      saveCurrentSentence(currentSentence);
      sentenceElement.innerHTML = renderSentence(currentSentence);
      updateIllustration(currentSentence);
      updateFavoriteControls();
      updatePreviousSentenceControl();
    }

    function showPreviousSentence() {
      const previousSentence = sentenceHistory.pop();
      if (!previousSentence) return;

      const difficulty = difficultyForSentence(previousSentence);
      if (difficulty) {
        difficultyInputs.forEach((input) => {
          input.checked = input.value === difficulty;
        });
        saveDifficulty(difficulty);
      }
      showSentence(previousSentence, { remember: false });
    }

    function showNewSentence() {
      let sentence;
      if (favoritesOnlyToggle.checked) {
        sentence = nextFavoriteSentence();
      } else {
        sentence = nextSentence(selectedDifficulty());
      }
      showSentence(sentence);
    }

    function showSearchResult({ difficulty, sentence }) {
      favoritesOnlyToggle.checked = false;
      difficultyInputs.forEach((input) => {
        input.checked = input.value === difficulty;
      });
      saveDifficulty(difficulty);
      showSentence(sentence);
      closeSearch();
    }

    function openSearch() {
      searchPanel.hidden = false;
      searchToggle.setAttribute("aria-expanded", "true");
      searchInput.focus();
      trackAnalyticsEvent("search-opened", "Search opened");
    }

    function closeSearch() {
      searchPanel.hidden = true;
      searchToggle.setAttribute("aria-expanded", "false");
    }

    function updateSearchResults() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      searchResults.replaceChildren();

      if (query === "") {
        searchStatus.textContent = "Type a word or phrase.";
        return;
      }

      const matches = searchableSentences.filter(({ plainText }) =>
        plainText.toLocaleLowerCase().includes(query)
      );
      searchStatus.textContent = matches.length === 1
        ? "1 matching sentence."
        : `${matches.length} matching sentences.`;

      matches.slice(0, 8).forEach((match) => {
        const button = document.createElement("button");
        button.className = "search-result";
        button.type = "button";
        button.textContent = match.plainText;
        button.addEventListener("click", () => showSearchResult(match));
        searchResults.append(button);
      });
    }

    function updateHighlighting() {
      sentenceCard.classList.toggle("highlights-off", !highlightToggle.checked);
    }

    function trackAnalyticsEvent(path, title) {
      if (!window.goatcounter?.count) return;
      window.goatcounter.count({ path, title, event: true, no_session: true });
    }

    function updateFavoriteControls() {
      const isFavorite = currentSentence !== null && favorites.has(currentSentence);
      favoriteToggle.textContent = isFavorite ? "★" : "☆";
      favoriteToggle.setAttribute("aria-pressed", String(isFavorite));
      favoriteToggle.setAttribute("aria-label", isFavorite
        ? "Remove sentence from favorites"
        : "Add sentence to favorites");
      favoriteToggle.title = favoriteToggle.getAttribute("aria-label");

      favoriteCount.textContent = String(favorites.size);
      favoritesOnlyToggle.disabled = favorites.size === 0;
      if (favorites.size === 0) {
        favoritesOnlyToggle.checked = false;
      }
      difficultyInputs.forEach((input) => {
        input.disabled = favoritesOnlyToggle.checked;
      });
    }

    function toggleFavorite() {
      if (favorites.has(currentSentence)) {
        favorites.delete(currentSentence);
      } else {
        favorites.add(currentSentence);
        trackAnalyticsEvent("favorite-added", "Favorite added");
      }

      favoriteDeck = [];
      saveFavorites();

      if (favoritesOnlyToggle.checked && !favorites.has(currentSentence)) {
        if (favorites.size === 0) {
          favoritesOnlyToggle.checked = false;
        }
        showNewSentence();
        return;
      }

      updateFavoriteControls();
    }

    function validateContent() {
      for (const difficulty of ["easy", "mixed", "hard"]) {
        if (sentences[difficulty].length !== 25) {
          throw new Error(`${difficulty} should contain exactly 25 sentences.`);
        }

        if (new Set(sentences[difficulty]).size !== sentences[difficulty].length) {
          throw new Error(`${difficulty} contains a duplicate sentence.`);
        }

        for (const sentence of sentences[difficulty]) {
          const markers = (sentence.match(/\*/g) || []).length;
          const targetCount = markers / 2;
          if (markers % 2 !== 0 || targetCount < 3) {
            throw new Error(`${difficulty} has a sentence with invalid target markup: ${sentence}`);
          }

          const ending = sentence
            .split(/;|,\s*|\s+(?:and|but|because|so|then|while|until)\s+/i)
            .at(-1);
          if (!ending.includes("*")) {
            throw new Error(`${difficulty} has an ending without an R target: ${sentence}`);
          }
        }

      }

      if (illustrations.length === 0
          || new Set(illustrations.map((item) => item.src)).size !== illustrations.length
          || new Set(illustrations.map((item) => item.sentence)).size !== illustrations.length
          || illustrations.some((item) => !availableSentences.has(item.sentence))) {
        throw new Error("Illustrations should uniquely map valid sentences to image files.");
      }
    }

    function showQaGallery() {
      practiceApp.hidden = true;
      qaView.hidden = false;

      for (const [difficulty, entries] of Object.entries(sentences)) {
        const group = document.createElement("section");
        group.className = "qa-group";

        const heading = document.createElement("h2");
        heading.innerHTML = `${escapeHtml(difficultyLabels[difficulty])} <span class="qa-count">${entries.length}</span>`;
        group.append(heading);

        const grid = document.createElement("div");
        grid.className = "qa-grid";

        entries.forEach((sentence, index) => {
          const card = document.createElement("article");
          card.className = "qa-card";
          const illustration = illustrations.find((item) => item.sentence === sentence);

          if (illustration) {
            const image = document.createElement("img");
            image.src = illustration.src;
            image.alt = "";
            image.loading = "lazy";
            image.decoding = "async";
            card.append(image);
          } else {
            const missing = document.createElement("div");
            missing.className = "qa-image-missing";
            missing.textContent = "No matching image";
            card.append(missing);
          }

          const copy = document.createElement("div");
          copy.className = "qa-card-copy";
          const sentenceText = document.createElement("p");
          sentenceText.innerHTML = renderSentence(sentence);
          copy.append(sentenceText);

          const meta = document.createElement("span");
          meta.className = "qa-meta";
          meta.textContent = `${index + 1} · ${illustration ? illustration.src.split("/").at(-1) : "unmapped"}`;
          copy.append(meta);
          card.append(copy);
          grid.append(card);
        });

        group.append(grid);
        qaGroups.append(group);
      }
    }

      showNewSentence();

        openSearch();
      } else {
        closeSearch();
      }
    });
    searchClose.addEventListener("click", closeSearch);
    difficultyInputs.forEach((input) => input.addEventListener("change", () => {
      saveDifficulty(input.value);
      showNewSentence();
      const label = difficultyLabels[input.value];
      trackAnalyticsEvent(`difficulty-${label.toLowerCase()}`, `Difficulty: ${label}`);
    }));

    validateContent();
    if (new URLSearchParams(window.location.search).has("qa")) {
      showQaGallery();
    } else {
      const savedDifficulty = loadDifficulty();
      difficultyInputs.forEach((input) => {
        input.checked = input.value === savedDifficulty;
      });
      updateHighlighting();
      const savedSentence = loadCurrentSentence();
      if (savedSentence) {
        showSentence(savedSentence, { remember: false });
      } else {
        showNewSentence();
      }
    }
  </script>
  <script data-goatcounter="https://say-r-althepal.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
